<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNARTEJ AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 90%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }
        #chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            background: #151515;
            border-radius: 5px;
        }
        .message {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #007bff;
            text-align: right;
            margin-left: 20%;
        }
        .bot-message {
            background-color: #28a745;
            text-align: left;
            margin-right: 20%;
        }
        .loading-message {
            background-color: #555555;
            text-align: left;
            font-style: italic;
        }
        #input-container {
            display: flex;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px 0 0 5px;
            background: #2a2a2a;
            color: white;
        }
        button {
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h2>GNARTEJ AI</h2>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                enviarMensaje();
            }
        }

        async function enviarMensaje() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const mensajeTexto = inputField.value.trim();

            if (mensajeTexto === "") return;

            // 1. Pintar el mensaje del usuario en la pantalla
            chatBox.innerHTML += `<div class="message user-message">${mensajeTexto}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Pintar bocadillo temporal de "Cargando..."
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div class="message loading-message" id="${loadingId}">Despertando a tu API... Esto puede tardar unos 30 segundos si estaba dormida en Render.</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. LLAMADA CORREGIDA A TU PROPIO SERVIDOR EN RENDER
                const respuestaServidor = await fetch('https://gnartej-api.onrender.com/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mensaje: mensajeTexto })
                });

                const datos = await respuestaServidor.json();

                // Quitar el mensaje de carga
                document.getElementById(loadingId).remove();

                // 4. Pintar la respuesta real que viene de tu server.js
                chatBox.innerHTML += `<div class="message bot-message">${datos.respuesta}</div>`;

            } catch (error) {
                console.error("Error al conectar:", error);
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot-message" style="background-color: #dc3545;">Error: No se ha podido conectar con el servidor de Render.</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>
